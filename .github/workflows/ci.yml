name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Allows re-running CI by hand. Without this, a run orphaned by a platform
  # incident cannot be retried at all: `gh run rerun` rejects a non-completed
  # run, and the only way to get a fresh result is an otherwise pointless commit.
  workflow_dispatch:

jobs:
  test:
    # Linux runner. This fork has no macOS runner entitlement: every macos-14 run is
    # cancelled before a step starts ("The configuration 'macos-14-arm64-us-default'
    # is not supported") and `test` is a required check, so no PR could merge at all.
    # mlx-audio (MLX) is Apple-only and cannot be installed here, so pyproject marks
    # it darwin-only and tests/conftest.py supplies a placeholder for the tests that
    # import src.tts; no test calls into MLX — each injects its own loader.
    # sounddevice still needs the PortAudio shared library, a system package on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PortAudio (sounddevice native dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run precommit checks
        run: make precommit
