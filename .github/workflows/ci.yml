name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Allows re-running CI by hand. Without this, a run orphaned by a platform
  # incident cannot be retried at all: `gh run rerun` rejects a non-completed
  # run, and the only way to get a fresh result is an otherwise pointless commit.
  workflow_dispatch:

jobs:
  test:
    # Apple Silicon runner: mlx-audio (MLX/Metal) and sounddevice (PortAudio) are
    # macOS/arm64-only, and src/ imports them at module load, so tests need them installed.
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PortAudio (sounddevice native dependency)
        run: brew install portaudio

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # make check runs `mcp-typecheck` (npm ci + tsc) over the TypeScript MCP
      # relay in mcp/, so the runner needs a pinned Node — without this the
      # `test` check was blind to every change under mcp/.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run precommit checks
        run: make precommit
