<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tts-mcp · voice control</title>
  <style>
    :root {
      --bg: #111418;
      --panel: #1a1f26;
      --border: #2a3038;
      --text: #e8edf2;
      --muted: #8b95a3;
      --accent: #4f8cff;
      --playing: #38c172;
      --paused: #f0b429;
      --idle: #8b95a3;
      --error: #e55b5b;
      --cancelled: #a0a0a0;
      --completed: #38c172;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      max-width: 760px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); }
    .dot.playing { background: var(--playing); }
    .dot.paused { background: var(--paused); }
    .dot.error { background: var(--error); }
    .status-label { font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.06em; }
    .sender { color: var(--muted); font-size: 13px; margin-left: auto; }
    .text { font-size: 15px; line-height: 1.45; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    /* A disabled control must not look pressable. At opacity .45 the accent
       blue still read as live, the cursor stayed default, and the click was
       swallowed with no feedback — so pressing Pause while idle was
       indistinguishable from a broken Pause. Reported 2026-08-29. */
    button:disabled {
      background: var(--border);
      color: var(--muted);
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.secondary { background: var(--border); }
    button.replay {
      margin-top: 0;
      margin-left: auto;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 500;
      background: var(--border);
      color: var(--text);
    }
    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
    .badge { border-radius: 4px; padding: 1px 7px; font-size: 11px; text-transform: uppercase; font-weight: 600; }
    .badge.queued { background: rgba(240, 180, 41, 0.15); color: var(--paused); }
    .badge.playing { background: rgba(79, 140, 255, 0.15); color: var(--accent); }
    .badge.completed { background: rgba(56, 193, 114, 0.15); color: var(--completed); }
    .badge.error { background: rgba(229, 91, 91, 0.15); color: var(--error); }
    .badge.cancelled { background: rgba(160, 160, 160, 0.15); color: var(--cancelled); }
    .history-text { color: var(--text); }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <h1>tts-mcp · voice control</h1>
  <div class="subtitle">Local TTS server · <span id="conn">connecting…</span></div>

  <div class="card">
    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span class="status-label" id="status">—</span>
      <span class="sender" id="sender"></span>
    </div>
    <div class="text" id="current-text">Nothing playing</div>
    <div style="display:flex; gap:8px;">
      <button id="toggle" disabled>Pause</button>
      <button id="skip" class="secondary" disabled>Skip</button>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:14px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;">Recent messages</h2>
    <div id="history"><div class="empty">No messages yet.</div></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    // Shown wherever a message carries no sender, so an unattributed utterance is
    // visible as such rather than silently blank.
    const UNKNOWN_SENDER = "unknown";

    async function post(path) {
      const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      if (!res.ok) {
        $("conn").textContent = "HTTP " + res.status;
      }
      poll();
    }

    async function replay(m) {
      if (!m || !m.text) return;
      // voice/engine come from the recorded message so the replay sounds like the
      // original. sender is prefixed rather than reused verbatim, so history stays
      // honest about which entries were replays.
      const body = {
        text: m.text,
        voice: m.voice || null,
        engine: m.engine || null,
        sender: m.sender ? "replay · " + m.sender : "replay",
        // A replay is the same message heard again, not a new one. Marked so the
        // server keeps it out of /state's recent list — otherwise replays evict the
        // very messages being caught up on from the history window.
        replay: true,
      };
      const res = await fetch("/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        $("conn").textContent = "replay failed: HTTP " + res.status;
      }
      poll();
    }

    // One icon per lifecycle state, rendered in the history list so a message
    // is visible from /say acceptance (queued) through playback (playing) to
    // completion (played). Map the server's status word to the user-facing label.
    const STATE_LABEL = {
      queued: "queued",
      loading: "queued",
      playing: "playing",
      paused: "playing",
      completed: "played",
      error: "error",
      cancelled: "cancelled",
    };

    function renderRow(m, replayIndex) {
      const label = STATE_LABEL[m.status] || m.status;
      const badge = '<span class="badge ' + (label === "played" ? "completed" : label) + '">' + label + "</span>";
      const sender = " · " + (m.sender || UNKNOWN_SENDER);
      const replay = replayIndex !== undefined
        ? '<button class="replay" data-i="' + replayIndex + '" title="Speak this message again">Replay</button>'
        : "";
      return (
        '<div class="history-item">' +
          '<div class="history-meta">' + badge + "<span>" + (m.engine || "") + "</span><span>" + sender + "</span>" + replay +
          "</div>" +
          '<div class="history-text">' + escapeHtml(m.text) + "</div>" +
        "</div>"
      );
    }

    function render(data) {
      const cur = data.current;
      const held = !!data.paused;
      const paused = cur && cur.status === "paused";
      const playing = cur && cur.status === "playing";

      // The hold is visible even at idle: Pause armed with nothing playing shows
      // as paused here so the armed queue-wide hold is not silent.
      const headerStatus = cur ? cur.status : (held ? "paused" : "idle");
      $("dot").className = "dot" + (headerStatus !== "idle" ? " " + headerStatus : "");
      $("status").textContent = headerStatus;
      // A missing sender is rendered explicitly, never as blank: an empty string is
      // indistinguishable from "no sender field at all", which is how the attribution
      // gap stayed invisible after the field shipped.
      $("sender").textContent = cur ? (cur.sender || UNKNOWN_SENDER) : "";
      $("current-text").textContent = cur ? cur.text : "Nothing playing";

      // Pause always works — even with nothing playing it arms the queue-wide
      // hold, and Resume clears it. Skip only makes sense mid-playback.
      $("toggle").disabled = false;
      $("toggle").textContent = (paused || held) ? "Resume" : "Pause";
      $("skip").disabled = !playing && !paused;

      const history = $("history");
      const pending = data.pending || [];
      const recent = data.recent || [];
      if (pending.length === 0 && recent.length === 0 && !cur) {
        history.innerHTML = '<div class="empty">No messages yet.</div>';
        return;
      }
      // Queued messages first (oldest queued on top), then the current message,
      // then played history. Each entry carries its state badge; Replay is only
      // meaningful on a finished (played/error/cancelled) entry.
      const rows = pending.map((m) => renderRow(m));
      if (cur) rows.push(renderRow(cur));
      rows.push(...recent.map((m, i) => renderRow(m, i)));
      history.innerHTML = rows.join("");
      // Bound by index into the recent payload we just rendered, so the exact
      // text / voice / engine that produced this entry is replayed — not a
      // re-derived guess, and not whatever the defaults happen to be at replay
      // time.
      history.querySelectorAll("button.replay").forEach((btn) => {
        btn.addEventListener("click", () => replay(data.recent[Number(btn.dataset.i)]));
      });
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    async function poll() {
      try {
        const res = await fetch("/state");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        $("conn").textContent = "connected";
        render(data);
      } catch (err) {
        $("conn").textContent = "offline — " + err.message;
        $("dot").className = "dot";
        $("status").textContent = "offline";
      }
    }

    $("toggle").addEventListener("click", () => {
      post($("toggle").textContent === "Resume" ? "/resume" : "/pause");
    });
    $("skip").addEventListener("click", () => post("/cancel"));

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
