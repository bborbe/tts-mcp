engine: voxtral
model: ./data/models/Voxtral-4B-TTS-2603-mlx-6bit
models_dir: ./data/models
sample_rate: 24000
lead_silence_ms: 400
default_voice: de_male
save_wav: true
simplify_punctuation: false
stream: true
streaming_interval: 1.0
streaming_warmup_seconds: 2.0
normalize_audio: true
target_lufs: -10.0
true_peak_ceiling_db: -1.0
min_duration_seconds: 0.5
host: 0.0.0.0
port: 12000
# Duck other applications' audio while the voice speaks. Requires the TTSDuck
# helper running under launchd (make duck-helper-agent) and its one-time
# audio-capture prompt allowed. Without either, speech simply plays at full music volume —
# ducking never breaks playback.
duck:
  enabled: false
  socket: ~/Library/Application Support/tts-mcp/duck.sock
  level: 0.25
  fade_ms: 150
